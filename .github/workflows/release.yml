# Builds Lumen for Windows, macOS and Android and attaches the installers to one GitHub
# Release. Run it by pushing a tag like v1.3.0. iPhone/iPad is compiled as a check only
# (an App Store build needs an Apple Developer account, see SETUP.md).
name: Release apps

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # create the release (with the English notes and warnings) once, before the builds upload to it
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          name: Lumen ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/vendor.js
      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Windows code signing: add these repository secrets once you have a certificate
          # (.pfx as base64 and its password). Without them the build is unsigned.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Lumen-Setup.exe
            dist/Lumen-macOS.dmg
          fail_on_unmatched_files: false

  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node scripts/vendor.js
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Lumen-Android.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: Lumen-Android.apk

  ios-check:
    needs: release
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/vendor.js
      - run: npx cap sync ios
      - name: Build for the iOS simulator (no signing)
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
